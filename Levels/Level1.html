<!DOCTYPE html>
<html>
<head>

<body>
    <h1 class="lilita-one-font">Level 1</h1>
    <button id="HintButton1" onclick="showHint(1)">Hint</button>

        <p><!--Hex--> 55 52 4c</p>
        <button id="HintButton2" onclick="showHint(2)">Hint 2</button>

    <hint id="Hint2" class="orbitron-font" style="display: none;">
        <p>Inspect <!--Hint1--></p>
    </hint>

    <hr>
    <!-- definitely not here -->

    <div class="spacer"></div>

    <!-- Bacon Cipher -->
    <p class="hidden-text">$££$£ ££$$$ £$£££ $£££$ £$£££ $£££$ $££$$ $£££$ ££$££ £$£$£ ££$££ $£££$ $£££$</p>
    <div class="spacer"></div>
    <p class="hidden-text">1:£ 2:$</p>

    <div class="spacer"></div><div class="spacer"></div>
    <p class="hidden-text">Not that far down...</p>

    <script src="../hint.js"></script>
